{% macro icon(name, size=20) -%}
<svg class="icon icon--{{ name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'network' -%}
  <rect x="9" y="2" width="6" height="5" rx="1.5"/><rect x="2" y="17" width="6" height="5" rx="1.5"/>
  <rect x="16" y="17" width="6" height="5" rx="1.5"/><path d="M12 7v4M5 17v-2a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v2"/>

  <rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/>
  <path d="M7 6.5h.01M7 17.5h.01"/>
{%- elif name == 'chart' -%}
  <path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 15l3.5-4 3 2.5L20 7"/>
{%- elif name == 'code' -%}
  <path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>
{%- elif name == 'mail' -%}

{%- elif name == 'phone' -%}

{%- elif name == 'linkedin' -%}
  <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6Z"/>
  <rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>
{%- elif name == 'globe' -%}
  <circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20Z"/>
{%- elif name == 'external' -%}
  <path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
{%- elif name == 'arrow-right' -%}
  <path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == 'arrow-up' -%}
  <path d="M12 19V5M5 12l7-7 7 7"/>
{%- elif name == 'arrow-down' -%}
  <path d="M12 5v14M19 12l-7 7-7-7"/>
{%- elif name == 'copy' -%}
  <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
{%- elif name == 'check' -%}
  <path d="m4 12 5.5 5.5L20 7"/>
{%- elif name == 'menu' -%}
  <path d="M3 6h18M3 12h18M3 18h18"/>
{%- elif name == 'close' -%}
  <path d="M18 6 6 18M6 6l12 12"/>
{%- elif name == 'cap' -%}
  <path d="M22 9 12 4 2 9l10 5 10-5Z"/><path d="M6 11.5V17c0 1.7 2.7 3 6 3s6-1.3 6-3v-5.5"/>
